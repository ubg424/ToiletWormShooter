<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Toilets Worms Shooter</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; font-family:Arial,sans-serif; }
    #game-container { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; background:#000; overflow:hidden; }
    #unity-canvas { display:block; width:100%; height:100%; background:#000; outline:none; }
    #loading { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#fff; background:#000; z-index:2; padding:20px; }
    #loading.hidden { display:none; }
    #loading-title { font-size:clamp(20px,4vw,32px); font-weight:700; text-align:center; }
    #progress-track { width:min(420px,75vw); height:10px; border-radius:20px; background:#333; overflow:hidden; }
    #progress-bar { width:0%; height:100%; background:#19a7ff; transition:width .15s; }
    #status { color:#bbb; font-size:13px; text-align:center; max-width:90vw; overflow-wrap:anywhere; }
    #fullscreen { position:absolute; top:max(12px,env(safe-area-inset-top)); right:max(12px,env(safe-area-inset-right)); z-index:3; border:1px solid #ffffff55; border-radius:8px; background:#111c; color:#fff; padding:10px 14px; font-size:14px; cursor:pointer; }
    #error { display:none; position:absolute; left:5%; right:5%; bottom:5%; z-index:4; padding:12px; color:#fff; background:#8b0000; border-radius:8px; white-space:pre-wrap; font-size:13px; max-height:45%; overflow:auto; }
  </style>
</head>
<body>
  <main id="game-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div id="loading-title">Loading Game...</div>
      <div id="progress-track"><div id="progress-bar"></div></div>
      <div id="status">Starting game...</div>
    </div>
    <div id="error"></div>
  </main>

  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const progressBar = document.getElementById('progress-bar');
    const statusText = document.getElementById('status');
    const errorBox = document.getElementById('error');

    const buildUrl = './Build/';

    // The DATA chunks are expected beside the loader in Build/:
    // WormsToiletsShooter_Crazy.data.br.part001 ... part004
    const DATA_BASE = buildUrl + 'WormsToiletsShooter_Crazy.data.br';
    const DATA_PARTS = 4;

    // The three compiled WASM chunks are now stored directly in Build/ (not
    // inside a separate 'WASM files' folder). Expected names:
    // Build/WormsToiletsShooter_Crazy_compiled.wasm.part001 ... part003
    const WASM_BASE = buildUrl + 'WormsToiletsShooter_Crazy_compiled.wasm';
    const WASM_PARTS = 3;

    const FRAMEWORK_FILE = buildUrl + 'WormsToiletsShooter_Crazy.framework.js.br';
    const LOADER_FILE = buildUrl + 'WormsToiletsShooter_Crazy.loader.js';

    const temporaryUrls = [];
    let unityInstance = null;

    function setProgress(percent, message) {
      progressBar.style.width = Math.max(0, Math.min(100, percent)) + '%';
      statusText.textContent = message;
    }

    function showError(message) {
      errorBox.style.display = 'block';
      errorBox.textContent = 'The game could not be loaded.\n\n' + message;
      statusText.textContent = 'Loading failed.';
    }

    function startsWithBytes(bytes, signature) {
      if (bytes.length < signature.length) return false;
      return signature.every((value, index) => bytes[index] === value);
    }

    function isReadableText(bytes) {
      const sample = bytes.subarray(0, Math.min(bytes.length, 512));
      if (!sample.length) return false;
      let acceptable = 0;
      for (const value of sample) {
        if (value === 9 || value === 10 || value === 13 || (value >= 32 && value <= 126)) acceptable++;
      }
      return acceptable / sample.length > 0.92;
    }

    async function fetchPart(baseFile, number, total) {
      const suffixes = [String(number).padStart(3, '0'), String(number).padStart(2, '0')];
      let lastError;
      for (const suffix of suffixes) {
        const url = baseFile + '.part' + suffix;
        try {
          const response = await fetch(url, { cache: 'no-store' });
          if (!response.ok) {
            lastError = new Error('HTTP ' + response.status + ' for ' + url);
            if (response.status === 404) continue;
            throw lastError;
          }
          const bytes = new Uint8Array(await response.arrayBuffer());
          if (!bytes.length) throw new Error('Part is empty: ' + url);
          return bytes;
        } catch (error) {
          lastError = error;
          if (String(error.message).includes('404')) continue;
          throw error;
        }
      }
      throw new Error('Missing part ' + number + ' of ' + total + '. Tried .part' + suffixes.join(' and .part') + ' for ' + baseFile + '. Last error: ' + (lastError?.message || 'not found'));
    }

    async function loadSplitFile(baseFile, count, label, startPercent, endPercent) {
      const chunks = new Array(count);
      let received = 0;
      let totalBytes = 0;
      for (let first = 1; first <= count; first += 4) {
        const last = Math.min(first + 3, count);
        const results = await Promise.all(Array.from({ length: last - first + 1 }, (_, index) => {
          const number = first + index;
          return fetchPart(baseFile, number, count).then(bytes => ({ number, bytes }));
        }));
        for (const item of results) {
          chunks[item.number - 1] = item.bytes;
          received++;
          totalBytes += item.bytes.byteLength;
        }
        const fraction = received / count;
        setProgress(startPercent + fraction * (endPercent - startPercent),
          'Downloading ' + label + ' parts: ' + received + '/' + count);
      }
      const joined = new Uint8Array(totalBytes);
      let offset = 0;
      for (const chunk of chunks) {
        if (!chunk) throw new Error(label + ' has a missing chunk.');
        joined.set(chunk, offset);
        offset += chunk.byteLength;
      }
      return joined;
    }

    function makeObjectUrl(bytes, mime) {
      const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
      temporaryUrls.push(url);
      return url;
    }

    async function getBrotliDecoder() {
      const module = await import('https://unpkg.com/brotli-wasm@3.0.1/index.web.js?module');
      return await module.default;
    }

    async function decompressIfBrotli(bytes, brotli, label, rawCheck) {
      if (rawCheck(bytes)) return bytes;
      try {
        const output = new Uint8Array(brotli.decompress(bytes));
        if (!output.length) throw new Error('Decompression produced an empty file.');
        return output;
      } catch (error) {
        if (isReadableText(bytes)) return bytes;
        throw new Error(label + ' is neither the expected raw file nor a valid complete Brotli stream. ' + error.message);
      }
    }

    async function startGame() {
      try {
        setProgress(1, 'Loading Brotli decoder...');
        const brotli = await getBrotliDecoder();

        setProgress(3, 'Downloading DATA parts...');
        const dataReceived = await loadSplitFile(DATA_BASE, DATA_PARTS, 'DATA', 3, 35);
        // Unity data archives begin with the ASCII header "UnityWebData1.0".
        const dataBytes = await decompressIfBrotli(dataReceived, brotli, 'DATA',
          bytes => startsWithBytes(bytes, [0x55,0x6E,0x69,0x74,0x79,0x57,0x65,0x62,0x44,0x61,0x74,0x61,0x31,0x2E,0x30]));

        setProgress(36, 'Downloading WASM parts...');
        const wasmReceived = await loadSplitFile(WASM_BASE, WASM_PARTS, 'WASM', 36, 72);
        // Binary WebAssembly starts with 00 61 73 6D (\0asm).
        const wasmBytes = await decompressIfBrotli(wasmReceived, brotli, 'WASM',
          bytes => startsWithBytes(bytes, [0x00,0x61,0x73,0x6D]));
        if (!startsWithBytes(wasmBytes, [0x00,0x61,0x73,0x6D])) {
          if (isReadableText(wasmBytes) && new TextDecoder().decode(wasmBytes.subarray(0, 20)).trimStart().startsWith('(module')) {
            throw new Error('The joined WASM parts contain WAT text beginning with "(module", not binary WebAssembly. Compile that WAT into a .wasm binary with wat2wasm first, then split the compiled .wasm into 3 parts.');
          }
          throw new Error('WASM file does not start with the binary WebAssembly signature 00 61 73 6D. First bytes: ' + Array.from(wasmBytes.subarray(0, 16), b => b.toString(16).padStart(2, '0').toUpperCase()).join(' '));
        }

        setProgress(73, 'Downloading Unity framework...');
        const frameworkResponse = await fetch(FRAMEWORK_FILE, { cache: 'no-store' });
        if (!frameworkResponse.ok) throw new Error('Could not fetch framework file: ' + FRAMEWORK_FILE + ' (HTTP ' + frameworkResponse.status + ')');
        const frameworkReceived = new Uint8Array(await frameworkResponse.arrayBuffer());
        const frameworkBytes = await decompressIfBrotli(frameworkReceived, brotli, 'FRAMEWORK', isReadableText);

        setProgress(88, 'Preparing Unity...');
        const config = {
          dataUrl: makeObjectUrl(dataBytes, 'application/octet-stream'),
          frameworkUrl: makeObjectUrl(frameworkBytes, 'application/javascript'),
          codeUrl: makeObjectUrl(wasmBytes, 'application/wasm'),
          streamingAssetsUrl: buildUrl + 'StreamingAssets',
          companyName: 'CrazyGames',
          productName: 'Toilets Worms Shooter',
          productVersion: '2'
        };

        if (typeof createUnityInstance !== 'function') {
          throw new Error('Unity loader loaded, but createUnityInstance was not found.');
        }

        createUnityInstance(canvas, config, progress => {
          setProgress(88 + progress * 12, 'Starting game... ' + Math.round(progress * 100) + '%');
        }).then(instance => {
          unityInstance = instance;
          window.unityInstance = instance;
          loading.classList.add('hidden');
          resizeGame();
        }).catch(error => showError(error?.message || String(error)));
      } catch (error) {
        showError(error?.message || String(error));
      }
    }

    const loader = document.createElement('script');
    loader.src = LOADER_FILE;
    loader.onload = startGame;
    loader.onerror = () => showError('Could not load Unity loader: ' + LOADER_FILE + '. Check that it exists in Build/.');
    document.head.appendChild(loader);

    function resizeGame() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(canvas.clientWidth * ratio);
      canvas.height = Math.round(canvas.clientHeight * ratio);
    }
    window.addEventListener('resize', resizeGame);
    window.addEventListener('orientationchange', () => setTimeout(resizeGame, 150));

    document.getElementById('fullscreen').addEventListener('click', async () => {
      try {
        const target = document.getElementById('game-container');
        if (!document.fullscreenElement) await target.requestFullscreen();
        else await document.exitFullscreen();
      } catch (error) {
        showError('Fullscreen is not available: ' + error.message);
      }
    });
    document.addEventListener('fullscreenchange', () => {
      document.getElementById('fullscreen').textContent = document.fullscreenElement ? '✕ Exit fullscreen' : '⛶ Fullscreen';
      setTimeout(resizeGame, 100);
    });
    window.addEventListener('beforeunload', () => temporaryUrls.forEach(url => URL.revokeObjectURL(url)));
  </script>
</body>
</html>
